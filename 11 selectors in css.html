<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css selectors</title>
    <style>
        /*element selector */
        p {
            border: 3px solid red;
        }

        /* id selector */
        #red {
            color: blue
        }

        #secondpara {
            color: aqua;
        }

        /* class selector */
        .blueelement {
            background-color: bisque;
        }
    </style>

</head>

<body>
    <h3>selectors in css</h3>
    <p id="red">
        this is a paragraph to demonstrate selectors in css
    </p>
    <p class="blueelement">
        this is another paragraph to demonstrate selectors in css
    </p>
    <p id="secondpara" class="blueelement">
        this is yet another paragraph to demonstrate selectors in css
    </p>
</body>

</html>
