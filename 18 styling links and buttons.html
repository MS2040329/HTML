<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo selectors and designing</title>
    <style>
        .container {
            border: 4px solid rgb(188, 21, 21);
            background-color: rgb(154, 222, 154);
            padding: 50px;
            margin: 50px auto;
            width: 500px;

        }

        a {
            text-decoration: none;
        }

        a:hover {
            color: black;
            background-color: aqua;
        }

        a:visited {
            color: white;
            background-color: blue;
        }

        a:active {
            color: chocolate;
            background-color: aquamarine;
        }

        button:hover {
            color: black;
            background-color: aqua;
        }

        button:active {
            color: chocolate;
            background-color: aquamarine;
        }

        button:visited {
            color: white;
            background-color: blue;
        }

        .btn {
            background-color: rgb(171, 15, 46);
            padding: 50px;
            border: none;
            cursor: pointer;
            font-size: 20px;
            border-radius: 5px;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container" id="cont1">
        <h3>this is heading
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Excepturi enim libero pariatur atque voluptas
                velit, eos officiis rerum veritatis molestias. Eaque, sapiente natus! Impedit quo excepturi ad sunt
                tempora rem, distinctio ex odio cum.</p>
            <a href="https://google.com" class="btn" target="blank">read more</a>
            <button class="btn">contact us</button>
        </h3>
    </div>

</body>

</html>
