<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>incline and block elements</title>
</head>
<body>

<!-- An inline element does not start on a new line. -->
<!-- An inline element only takes up as much width as necessary. -->
<span style="border:2px solid red; height: 50vh; width: 60vw">this is a span</span>
<span style="border:2px solid red; height:50vh;width:50vw">this is also a span</span>

<!--A block-level element always starts on a new line,
     and the browsers automatically add some space (a margin) before and after the element.-->

<!-- A block-level element always takes up the full width available  -->
<p style="border:2px solid red; height:50vh ;width:50vw">this is a paragraph</p>
<p style="border:2px solid red; height:50vh ;width: 50vw">this is also a paragraph</p>    
</body>
</html>
