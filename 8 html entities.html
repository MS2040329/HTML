<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html entities</title>
</head>
<body>
    <h3>HTML Entities</h3>
    <!-- An HTML entity is a piece of text ("string") that begins with an ampersand ( & ) and ends with a semicolon ( ; ).
         HTML entities are frequently used to display reserved characters
          (which would otherwise be interpreted as HTML code), and invisible characters (like non-breaking spaces). -->
     <div class="container">
        <p>my name is manoj</p>
     </div>
     <div class="container">
        <p>this is for space between manoj &nbsp;  sharma</p>
        <p>this is for paragraph tag &lt;p&gt;</p>
        <p>this is for pound &pound;</p>
        <p>this is for copyright icon &copy;</p>
     </div>
     <!-- for more html entities use google search engine -->
    
</body>
</html>
