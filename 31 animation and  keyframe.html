<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>creating animation and keyframes</title>
    <style>
        .container{
           
           background-color: yellowgreen;
           height: 100%;
        }
        .box{
            background-color: yellow;
            height: 100px;
            width: 100px;
           position: relative;
           animation-name: manoj1;
           animation-duration: 5s;
           animation-timing-function: ease-in;
           animation-delay: 3s;
           animation-iteration-count: 2;
           animation-fill-mode: alternate;

            /* These properties can be set using this shorthand */
        /* animation: animation-name animation-duration animation-timing-function animation-delay animation-iteration-count animation-fill-mode; */
        /* animation: harry 5s ease-in 1s 12 backward*/
        }
         @keyframes manoj{
            from{width:60px;}
            to{width:200px}
        } 
        @keyframes manoj1{
            0%{
                top:0px;
                left: 0px;
            }

            25%{
                top:250px;
                left: 0px;
            }

            75%{
                top:250px;
                left: 250px;
            }

            100%{
                top:0px;
                left:250px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="box">
        this is a box
    </div>
</div>
    
</body>
</html>
