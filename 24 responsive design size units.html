<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>size units</title>
</head>
<style>
    h1 {

        text-align: center;
    }

    .container {
        width: 500px;
        border: 2px solid red;
        height: 130vh;
        width: 100vw;
        font-size: 3px;
    }

    #first {
        font-size: 10em;
        padding: 2em;

    }

    #second {
        font-size: 3rem;
        padding: 3rem;
    }
</style>

<body>
    <div class="container">
        <h1 id="first">this is first heading</h1>
        <h1 id="second">this is second heading</h1>
        <h1 id="third">this is third heading</h1>

    </div>

</body>

</html>
