<!-- Doctype HTML is a declaration that tells the browser what version of HTML the document is written in.
     This declaration appears as the very first line in an HTML file. -->
<!DOCTYPE html>
<!--our HTML code starts here-->
<!-- ctrl/ for making a sentence comment -->

<!-- The <html lang=”en'> 
     specifies the language code of the page meaning en or English is used for all the text on the page. -->
<html lang="English">
<!--our head tag starts here : It contains meta tags and title tags-->

<head>
    <!-- meta tag gives information about information  -->
    <!-- The charset attribute specifies the character encoding for the HTML document -->
    <meta charset="UTF-8">
    <!-- The viewport is the user's visible area of a web page.
         The viewport varies with the device, and will be smaller on a mobile phone than on a computer screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--meta description tag informs and interests users with a short summary of what a particular page is about.  -->
    <meta name="description" content="this is the description of the site">
    <meta name="keywords" content="pizza,itilian pizza,veg and non veg pizza">
    <title>
        Dominos
    </title>
    <!-- this s how we can include external css file -->
    <link rel="stylesheet" href="style.css">
    <!-- this is how we can add external javascript file -->
    <script src="manoj.js">
        
    </script>
    
</head>
<!--our body content starts here-->
<body>
    serving the best indian and italian pizzas
</body>

</html>
