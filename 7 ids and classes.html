<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ids and classes in html</title>
</head>
<body>
    <h3>ids and classes tutorial</h3>
    <div id="mainbox" class="manoj">
         hi this side manoj
    </div>
    <span class="manoj">this is a span</span>
    <!-- emmet -->
    <!-- span.manoj+enter key -->
    <span class="manoj">emmet to create a span class</span>
    <!-- type:span#mainspan=enter key  -->
    <span id="manoj">emmet to create a span id</span>
    <!-- .is for class and # is for id -->

    <!--type: div.manoj.riddim +enter key-->
    <div class="manoj riddim">to create multiple classes using emmet function</div>

    <!-- emmet takes div tag as default 
        type:.manoj,riddim+enter  -->
    <div class="manoj sharma"></div>

    <!-- creating  multiple elements using emmet  -->
    <!-- type:span.class.class1,class2*4+tab key  -->
    <span class="class class1 class2">first</span>
    <span class="class class1 class2">second</span>
    <span class="class class1 class2">third</span>
    <span class="class class1 class2">fourth</span>


    
</body>
</html>
