<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>visibility and z index</title>
    <style>
        .box{
            height: 63px;
            width: 108px;
            border: 2px solid rgb(3, 16, 3);

        }

        #box1{
            
background-color: aqua;
        }
        #box2{
         /*   display: none; hide the elements and donot reserve space*/
       /*  visibility: hidden; hide element and reserve the space*/
       position: relative;
       top: 33px;
       z-index: -10000;
background-color: rgb(51, 249, 64);
        }
         #box3{position: relative;/*z-index is the CSS property that controls the stacking order of overlapping elements on a page. An element with a higher z-index value will appear in front of an element with a lower z-index value. The property is called “z-index” because it sets the order of elements along the z-axis. */
            top: 20px;
            z-index: -1000;
background-color: rgb(246, 46, 143);
        }
        #box4{position: relative;
            z-index: -100;
background-color: rgb(242, 125, 15);
        }


    </style>
</head>
<body>
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
    <div class="box" id="box4"></div>
</body>
</html>
