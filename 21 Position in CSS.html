<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position absolute, relative, fixed and sticky in CSS</title>
    <style>
        .container{
            border: 2px solid greenyellow;
            background-color: khaki;
            height: 3333px;
        }
        .box{
            border: 4px solid royalblue;
            width: 150px;
            height: 150px;
            margin:2px;
            display: inline-block;
        }
         #box3{/*position: relative; relative:relative to its normal position */
            /* position: absolute; absolute:relative to its first parent
             */
             /* position: fixed; fixed:relative to web window */
             position: sticky;/*sticky:sticks element to its normal position*/
            top: 20px;
            left: 30px;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
        <div class="box" id="box4">4</div>

    </div>
</body>
</html>
