<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>background color,border,image</title>
    <style>
        #firstpara
        
        {
            background-color: rgb(181, 80, 141);
            height: 56px;
            width: 200px;
            border: 4px solid rgb(80, 202, 151);
            border-radius: 20px;
        }



        #secondpara
        
        {
            background-color: rgb(42, 170, 76);
            height: 56px;
            width: 200px;
            border-bottom: 4px solid rgb(145, 13, 13);
            border-top: 10px solid rgb(145, 13, 13);
            border-left: 4px solid rgb(145, 13, 13);
            border-right: 10px solid rgb(145, 13, 13);
            border-bottom-right-radius: 50px;
            /* border-top-left-radius:__px ;
            border-top-right-radius:__px ;
            border-bottom-left-radius:__px ;*/
        }


        #thirdpara

        { height: 300px;
            width: 200px;
            background-image:url(https://avatars.githubusercontent.com/u/169830067?s=96&v=4);
            border: 2px solid rgb(132, 143, 12);
            background-repeat:no-repeat ;
            /* background-repeat:  repeat-x;
            background-repeat:  repeat-y; */
            background-position: center ;
            background-color: aquamarine;
        }
    </style>
</head>

<body>
    <h2>Tutorial(background color,border,image)</h2>
    <p id="firstpara">this is first paragraph</p>
    <p id="secondpara">this is second paragraph</p>
    <p id="thirdpara">this is third paragraph</p>
</body>

</html>
