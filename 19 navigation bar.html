<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navigation menu</title>
    <STYLE>
        .navbar {
            background-color: black;
            border: 2px solid black;
            border-radius: 15px;
            height: 44px;
            

        }
        .navbar ul{
            overflow: auto;
            list-style: none;
            margin-top: 1px;
        }

        .navbar li {
            color: white;
            float: left;
            margin: 10px 4px;
        }
        .navbar li a{
            padding:15px 13px;
            text-decoration: none;
        }
        .navbar input{
            border: 2px solid black;
            border-radius: 18px;
            padding: 7px 20px;
            width: 135px;
            text-align: justify;
            margin-bottom: 0px;
        }
        .search{
            float: right;
            color: white;
            padding:7px 23px;
        }
        a:hover{
            color: red;
        }
        
    </STYLE>
</head>

<body>
    <header>
        <nav class="navbar">
            <ul>
                <li>
                    <a href="#" target="_blank">HOME</a>
                </li>
                <li>
                    <a href="#" target="_blank">ABOUT</a>
                </li>
                <li>
                    <a href="#" target="_blank">SERVICES</a>
                </li>
                <li>
                    <a href="#" target="_blank">CONTACT US</a>
                </li>
                <div class="search">
                   
                    <input type="text" name="search" id="search" placeholder="search this website">

                </div>
            </ul>
        </nav>
    </header>

</body>

</html>
