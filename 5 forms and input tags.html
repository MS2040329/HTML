<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms and input tags</title>
</head>

<body>
    <h2>this is html form tutorial</h2>
    <!-- The form tag in HTML is used to collect data from the user and send it to the server for further processing.
         It is used with other elements such as input, textarea, and submit, which are used to make a complete form. -->
    <form action="backend.python">
        <div>
            <label for="name">name:</label>
            <input type="text" name="Myname" id="name">
            <!--in name we write the the name by which our data is saved in the backend-->
        </div>

        <br>

        <div>
            <label for="role">role:</label>
            <input type="text" name="My role" id="role"> <!--input type-->
        </div>

        <br>

        <div>
            <label for="email">email:</label>
            <input type="text" name="My email" id="email">
        </div>

        <br>

        <div>
            <label for="date">date:</label>
            <input type="date" name="date" id="date">
        </div>

        <br>

        <div>
            <label for="salary">salary:</label>
            <input type="number" name="my salary" id="salary">
        </div>
        
        <br>

        <div>
            <label for="Are you 18 +">Are you 18 +:</label>
            <input type="checkbox" name="eligibility" id="Are you 18 +" checked>
            <!--write checked after name to keep checkbox checked-->
        </div>

        <br>

        <div>
            <p>Gender:</p>
            <label for="male">male</label>
            <input type="radio" name="my gender" id="male">
            <label for="female">
                female<input type="radio" name="my gender" id="female">
            </label>
        </div>

        <br>

        <div>
            <label for="hobbies">write about your hobbies</label>
            <textarea name="mytext" cols="30" rows="2" id="hobbies"></textarea>
        </div>

        <br>

        <div>
            <label for="car">car</label>
            <select name="my car" id="car">
                <option value="swt" selected>swift</option>
                <!--type selected after value to make the option selected bydefault-->
                <option value="ind">indica</option>
                <option value="ai">audi</option>
            </select>
        </div>


        <br>
        <hr>

        <div>
            <label for="submit">submit</label>
            <input type="submit" value="submit now" id="submit">
            <label for="reset">reset</label>
            <input type="reset" value="reset now" id="reset">
        </div>





    </form>
</body>

</html>
